version: '3.8'

services:
  # API Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      - rabbitmq

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  # PostgreSQL Database
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: erpadmin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: erp_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis Cache
  redis:
    image: redis:6
    ports:
      - "6379:6379"

  # User Management Service
  user-service:
    build:
      context: ./services/user-management
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - rabbitmq

  # Inventory Service
  inventory-service:
    build:
      context: ./services/inventory
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - rabbitmq

  # Finance Service
  finance-service:
    build:
      context: ./services/finance
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - rabbitmq

  # HR Service
  hr-service:
    build:
      context: ./services/hr
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - rabbitmq

  # Orchestration Agent
  orchestration-agent:
    build:
      context: ./agents/orchestration
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq

  # Integration Agent
  integration-agent:
    build:
      context: ./agents/integration
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq

volumes:
  postgres_data:
